<g font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" fill="#ead9b4">
<text x="306.25" y="168.50" font-size="26" font-style="italic" text-anchor="middle" opacity="0.72">ἄνδρα μοι ἔννεπε, μοῦσα, πολύτροπον</text>
<line x1="216.25" y1="198.50" x2="396.25" y2="198.50" stroke="#c99b3f" stroke-width="1.2" opacity="0.85"/>
<text x="82.50" y="244.50" font-size="19.36" opacity="0.92">A complete line-for-line English translation</text>
<text x="82.50" y="270.44" font-size="19.36" opacity="0.92">of Homer’s <tspan font-style="italic">Odyssey</tspan> — all 24 books, 12,107</text>
<text x="82.50" y="296.38" font-size="19.36" opacity="0.92">lines, with one English line for every line of</text>
<text x="82.50" y="322.33" font-size="19.36" opacity="0.92">the Greek and the same line numbering</text>
<text x="82.50" y="348.27" font-size="19.36" opacity="0.92">throughout, so any passage can be cited as</text>
<text x="82.50" y="374.21" font-size="19.36" opacity="0.92">book.line and found in either language.</text>
<text x="82.50" y="414.67" font-size="17.60" opacity="0.8">The edition carries a scholarly apparatus of 1,260</text>
<text x="82.50" y="438.26" font-size="17.60" opacity="0.8">line notes and an index of every named person,</text>
<text x="82.50" y="461.84" font-size="17.60" opacity="0.8">god, people, and place in the poem.</text>
<text x="82.50" y="498.63" font-size="16.72" opacity="0.72">Translated by Claude (Fable 5), a large language</text>
<text x="82.50" y="521.03" font-size="16.72" opacity="0.72">model, under the editorial direction of Chris Duffy.</text>
<text x="82.50" y="543.44" font-size="16.72" opacity="0.72">The translation is dedicated to the public domain</text>
<text x="82.50" y="565.84" font-size="16.72" opacity="0.72">under CC0 1.0: no permission or attribution is</text>
<text x="82.50" y="588.25" font-size="16.72" opacity="0.72">required for any use.</text>
</g>
